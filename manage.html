<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>FORM</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="header">
            <div class="header-item">
                <img src="images/logo.PNG">
            </div>

            <div class="header-item">Home</div>
            <div class="header-item">Contact-Us</div>
            <div class="header-item">Free Tools</div>
            <div class="header-item">learn</div>
            <div class="header-item">login</div>
        </div>

        <div class="heading">
            <h3>What is Home without PNOK? JOIN THE SMILES</h3>
        </div>

        <div class="form">
            <div class="personal-details">

            <div class="personal-form">
                <h1>Personal details</h1>
            </div>

            <div class="personal-form">
                <label>Name</label>
                <input type="text" placeholder="Enter Your Name">
            </div>

            <div class="personal-form">
                <label>Surname</label>
                <input type="text" placeholder="Enter Your Surname">
            </div>

             <div class="personal-form">
                <label>Email</label>
                <input type="text" placeholder="Enter Your Email">
            </div>

             <div class="personal-form">
                <label>Address</label>
                <input type="text" placeholder="Enter Your Address">
            </div>

             <div class="personal-form">
                <label>Contact Number</label>
                <input type="text" placeholder="Enter Your Number">
            </div>

             <div class="personal-form">
                <label>Gender</label>
                <input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female
            </div>
        </div>

        <div class="property-details">
            <div class="personal-form">
                <h1>Property details</h1>
            </div>

            <div class="property-form">
                <label>Property Address</label>
                <input type="text" placeholder="Enter Property Address">
            </div>

            <div class="property-form">
                <label>Number of Bedrooms</label>
                <select>
                    <option>Select</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>6</option>
                    <option>6+</option>
                </select> 
            </div>

            <div class="property-form">
                <label>Number of Bathrooms</label>
                <select>
                    <option>Select</option>
                    <option>1</option>
                    <option>1.5</option>
                    <option>2</option>
                    <option>3</option>
                 </select> 
            </div>

            <div class="property-form">
                <label>Property Size</label>
                <input type="text" placeholder="example 40">
            </div>

            

            <div class="property-form">
                <label>Residential Zone</label>
                <select>
                    <option>Select</option>
                    <option>Urban Area</option>
                    <option>Township</option>
                    <option>Rural Area</option>
                </select>
             </div>

          <div class="property-details">
                <label>Tenanted?</label>
                <input type="radio" name="Tenant">YES
                <input type="radio" name="Tenant">NO
            </div>

         </div>
        </div>
    </div>
       
      <div class="property-form">
                <button>Submit Form</button>
            </div>
        
            <div id="estimate">
                  <label>Estimated Monthly Rent</label>
                  <input type="text" placeholder="R">
            </div>
          
        
        <script src="script.js" async defer></script>
    </body>
</html>
